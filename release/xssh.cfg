# Copy beside default.xbe (as D:\xssh.cfg on the original Xbox)
# SSH settings below are optional PREFILLS for the on-screen login form.
# The app always asks for server IP, port, username and password when opened.
# Typing into a prefilled field replaces its initial value.
# The password is never saved here.

host=192.168.1.10
port=22
user=myuser

# 64-character lowercase SHA-256 hex of the server's negotiated raw SSH host key.
# For first-time connections, the app asks you to verify the host key on screen.
# Approved keys are saved in D:\xssh-known-hosts.txt.
# This pin applies only when the entered host and port match this config.
hostkey_sha256=

# Video: auto | 480i | 480p | 720p | 1080i | preset@Hz | WxH[@Hz] | WxHp[@Hz] | WxHi[@Hz]
# 480p/720p/1080i depend on cable, dashboard settings, BIOS and nxdk HAL.
# auto uses the resolution active when XSSH starts (dashboard/launcher mode),
# when nxdk HAL supports it. Only uses a safe fallback if unavailable.
# Some BIOSes reset the mode when launching an XBE; exact inheritance then
# cannot be guaranteed.

video_mode=auto

# Terminal font height in the 640x480 logical display: 8 through 24.
# 10 = about 91x42 with USB keyboard, 91x28 with controller keyboard.

font_size=12
font_style=cousine

# Text smoothing: no (sharp bitmap, default) | yes (grayscale antialiasing)
text_antialiasing=no

# Theme: xbox (green text on black) | inverted_xbox (black text on green)

theme=xbox

# Network: dhcp (default) | static
# DHCP requests a lease with nxdk. The address may differ from the previous
# dashboard address; dashboard static settings are not automatically inherited.

network_mode=dhcp

# Only used for network_mode=static. Use the Xbox's address, NOT the SSH host.
# network_ip=192.168.1.50
# network_netmask=255.255.255.0
# network_gateway=192.168.1.1
# Front Xbox LED: auto | green | red | orange | off | blink_green | blink_red | alternate
# auto: orange while connecting, green when connected, red on error, off in screensaver.
led_mode=auto

# Low-CPU raw RGB565 video screensaver; keeps SSH connected while playing.
# Wakes with any key or controller button. No sound/codec decoding.
screensaver_enabled=yes
screensaver_seconds=120
screensaver_file=D:\screensaver.xsv
